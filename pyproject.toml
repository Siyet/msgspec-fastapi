[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "msgspec-fastapi"
version = "0.0.2"
description = "Experimental FastAPI router that decodes request bodies and encodes responses with msgspec"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aleksandr Tseluiko" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.142.2,<0.148",
    "msgspec>=0.22.0",
]

[project.urls]
Source = "https://github.com/Siyet/msgspec-fastapi"
Issues = "https://github.com/Siyet/msgspec-fastapi/issues"

[dependency-groups]
test = ["pytest", "httpx", "httpx2", "python-multipart"]

[tool.hatch.build.targets.wheel]
packages = ["src/msgspec_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
