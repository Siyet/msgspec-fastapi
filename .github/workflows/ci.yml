name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install lint tools
        run: uv sync --python 3.11 --only-group lint
      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install typing tools
        run: uv sync --python 3.13 --group typing
      - name: Check source types
        run: uv run --no-sync mypy src/msgspec_fastapi --follow-imports=silent
      - name: Check the native interface stubs
        run: uv run --no-sync python -m mypy.stubtest msgspec_fastapi._defaults --concise

  test:
    name: Python ${{ matrix.python }}, ${{ matrix.bounds }} dependency bounds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        bounds: [latest, lowest]
    env:
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install
        run: uv sync --python "$PYTHON" --group test
      - name: Install the lowest supported FastAPI and msgspec
        if: matrix.bounds == 'lowest'
        run: uv pip install "fastapi==0.142.2" "msgspec==0.22.0"
      - name: Show versions
        run: uv run --no-sync python -c "import sys, fastapi, msgspec, pydantic, starlette; print(sys.version); print(fastapi.__version__, msgspec.__version__, pydantic.__version__, starlette.__version__)"
      - name: Check the lowest versions
        if: matrix.bounds == 'lowest'
        # `uv run` without --no-sync would reinstall the locked versions.
        run: uv run --no-sync python -c "import fastapi, msgspec; assert (fastapi.__version__, msgspec.__version__) == ('0.142.2', '0.22.0')"
      - name: Test
        run: uv run --no-sync pytest

  build:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-wheels.yml
